# ============================================================
# SonarQube Configuration — sonar-project.properties
# ============================================================
# WHY SonarQube:
#   Static analysis tool that detects:
#   - Bugs (potential null dereferences, off-by-one errors)
#   - Code Smells (long methods, duplicate code, complex functions)
#   - Security Vulnerabilities (OWASP Top 10 patterns)
#   - Security Hotspots (places that need manual security review)
#   - Coverage tracking (fail build if coverage drops)
#
# Setup Steps:
#   1. Create account at sonarcloud.io (free for open source)
#      OR self-host SonarQube Community Edition
#   2. Create a new project → get SONAR_TOKEN
#   3. Add SONAR_TOKEN + SONAR_HOST_URL to GitHub Secrets
#   4. Add sonar-project.properties to root of repo
# ============================================================

sonar.projectKey=mern-boilerplate
sonar.projectName=MERN E-Commerce Boilerplate
sonar.projectVersion=1.0

# Source directories
sonar.sources=backend/src,frontend/src

# Test directories (excluded from main analysis, tracked for coverage)
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions — don't analyze generated/vendor code
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.config.*,\
  **/test/setup.*,\
  **/__mocks__/**,\
  frontend/public/mockServiceWorker.js

# Coverage reports (generated by Jest/Vitest with lcov reporter)
sonar.javascript.lcov.reportPaths=\
  backend/coverage/lcov.info,\
  frontend/coverage/lcov.info

# TypeScript
sonar.typescript.tsconfigPath=backend/tsconfig.json,frontend/tsconfig.json

# Quality Gate settings (configure in SonarQube UI):
#   Coverage:     New code must have > 80% coverage
#   Duplications: New code must have < 3% duplication
#   Maintainability: New code rating must be A
#   Reliability:  New code rating must be A
#   Security:     New code rating must be A
