# ============================================================
# docker-compose.yml — Local Development Stack
# ============================================================
# WHY docker-compose for dev:
#   Spins up all services (Postgres, Redis, backend, frontend) 
#   with a single command. No manual installation needed.
#   Every intern gets an identical environment — no "works on my machine".
#
# Usage:
#   docker-compose up           → Start all services
#   docker-compose up -d        → Start in background
#   docker-compose down         → Stop all
#   docker-compose down -v      → Stop + delete volumes (fresh DB)
#   docker-compose logs -f api  → Follow API logs
# ============================================================

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mern_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mern_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # WHY volume: Persists DB data between container restarts
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mern_redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # WHY: Persistence — survive restarts
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres      # WHY 'postgres': docker-compose DNS resolves service names
      DB_PORT: 5432
      DB_NAME: mern_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: dev_access_secret_change_in_production
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_production
      FRONTEND_URL: http://localhost:3000
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:5000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mern_frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
      VITE_WS_URL: http://localhost:5000
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  # ── pgAdmin (DB GUI) ───────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mern_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
